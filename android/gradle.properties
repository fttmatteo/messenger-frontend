# Configuraciones de Gradle para todo el proyecto.

# Usuarios de IDE (ej. Android Studio):
# Las configuraciones de Gradle a través del IDE *sobrescribirán*
# cualquier configuración especificada en este archivo.

# Para más detalles sobre cómo configurar tu entorno de compilación visita
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Especifica los argumentos de la JVM usados para el proceso daemon.
# Esta configuración es particularmente útil para ajustar configuraciones de memoria.
org.gradle.jvmargs=-Xmx1536m

# Cuando se configura, Gradle se ejecutará en modo paralelo en incubación.
# Esta opción solo debe usarse con proyectos desacoplados. Para más detalles, visita
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Estructura del paquete AndroidX para aclarar qué paquetes vienen con
# el sistema operativo Android y cuáles se empaquetan con el APK de tu app
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
