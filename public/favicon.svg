<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- Cuadrado redondeado de fondo -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bgGrad)"/>
  
  <!-- Icono de placa/documento -->
  <rect x="25" y="20" width="50" height="60" rx="5" fill="white" opacity="0.9"/>
  
  <!-- Líneas del documento -->
  <rect x="32" y="30" width="36" height="4" rx="2" fill="#3b82f6"/>
  <rect x="32" y="40" width="24" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="32" y="48" width="30" height="3" rx="1.5" fill="#94a3b8"/>
  <rect x="32" y="56" width="20" height="3" rx="1.5" fill="#94a3b8"/>
  
  <!-- Check mark -->
  <circle cx="70" cy="65" r="12" fill="#22c55e"/>
  <path d="M64 65 L68 69 L76 61" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
